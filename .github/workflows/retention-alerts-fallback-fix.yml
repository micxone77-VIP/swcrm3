name: Retention Alerts Fallback Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify RED regression
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/pages/ChurnAlerts.jsx').read_text()
          needle="const results=[];Object.entries(byUser).forEach(([username,rawSnaps])=>{"
          if needle not in s: raise SystemExit('Expected priority builder not found')
          print('RED target confirmed: priority queue depends only on daily snapshots')
          PY
      - name: Apply priority fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/ChurnAlerts.jsx')
          s=p.read_text()
          old="""const results=[];Object.entries(byUser).forEach(([username,rawSnaps])=>{const vip=vipMap[username];if(!vip)return;const snaps=[...rawSnaps].sort((a,b)=>a.snapshot_date.localeCompare(b.snapshot_date));"""
          new="""const results=[];Object.entries(byUser).forEach(([username,rawSnaps])=>{const vip=vipMap[username];if(!vip)return;const snaps=[...rawSnaps].sort((a,b)=>a.snapshot_date.localeCompare(b.snapshot_date));"""
          if old not in s: raise SystemExit('Priority builder anchor missing')
          # Replace only the final result construction so VIPs with no daily snapshots can still enter priority from member inactivity.
          old_tail="""if(reasons.length>0)results.push({id:vip.id,username,tier:vip.tier,currency:vip.currency,host:vip.host_assigned,phone:vip.phone,whatsapp:vip.whatsapp,last_deposit_date:lastDepositDate,days_since_deposit:daysSinceDeposit,decline_pct:declinePct,net_win_loss_3d:netWinLoss3d,reasons,urgency_score:urgencyScore})});results.sort"""
          new_tail="""const memberInactiveDays=Number(vip.days_inactive)||0;if(daysSinceDeposit===null&&memberInactiveDays>=3){reasons.push(`No deposit for ${memberInactiveDays} days — may become a churn case soon`);urgencyScore=Math.max(urgencyScore,2)}if(reasons.length>0)results.push({id:vip.id,username,tier:vip.tier,currency:vip.currency,host:vip.host_assigned,phone:vip.phone,whatsapp:vip.whatsapp,last_deposit_date:lastDepositDate||vip.last_deposit_date||null,days_since_deposit:daysSinceDeposit??memberInactiveDays,decline_pct:declinePct,net_win_loss_3d:netWinLoss3d,reasons,urgency_score:urgencyScore})});results.sort"""
          if old_tail not in s: raise SystemExit('Priority result tail missing')
          s=s.replace(old_tail,new_tail,1)
          # Also add VIP-member fallback entries when the daily snapshot query returns no row for a priority VIP.
          marker="""results.sort((a,b)=>getRetentionTierRank(a.tier)-getRetentionTierRank(b.tier)||b.urgency_score-a.urgency_score||String(a.username).localeCompare(String(b.username)));setPriorityList(results)"""
          replacement="""const existingUsers=new Set(results.map(x=>x.username));(pdVips||[]).forEach(vip=>{if(existingUsers.has(vip.username))return;const inactiveDays=Number(vip.days_inactive)||0;if(inactiveDays<3)return;results.push({id:vip.id,username:vip.username,tier:vip.tier,currency:vip.currency,host:vip.host_assigned,phone:vip.phone,whatsapp:vip.whatsapp,last_deposit_date:vip.last_deposit_date||null,days_since_deposit:inactiveDays,decline_pct:null,net_win_loss_3d:0,reasons:[`No deposit for ${inactiveDays} days — may become a churn case soon`],urgency_score:2})});results.sort((a,b)=>getRetentionTierRank(a.tier)-getRetentionTierRank(b.tier)||b.urgency_score-a.urgency_score||String(a.username).localeCompare(String(b.username)));setPriorityList(results)"""
          if marker not in s: raise SystemExit('Priority sort marker missing')
          s=s.replace(marker,replacement,1)
          p.write_text(s)
          PY
      - name: Verify GREEN regression
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/pages/ChurnAlerts.jsx').read_text()
          for needle in ['const memberInactiveDays=Number(vip.days_inactive)||0;', 'const existingUsers=new Set(results.map(x=>x.username));']:
            if needle not in s: raise SystemExit('GREEN check failed: '+needle)
          print('GREEN: member inactivity fallback is present')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Restore generated dist
        run: git checkout -- dist 2>/dev/null || true
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ChurnAlerts.jsx .github/workflows/retention-alerts-fallback-fix.yml
          git commit -m "fix: surface dormant priority VIPs without daily snapshots" || exit 0
          git push origin main
