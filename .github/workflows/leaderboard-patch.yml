name: Apply Leaderboard Metric Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[leaderboard-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CRM leaderboard logic and modal width
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/Campaigns.jsx')
          source = path.read_text()

          old_modal = "modal:    { background:'var(--surface)', border:'1px solid var(--border)', borderRadius:14, width:'100%', maxWidth:720, maxHeight:'90vh', overflowY:'auto' },"
          new_modal = "modal:    { background:'var(--surface)', border:'1px solid var(--border)', borderRadius:14, width:'100%', maxWidth:1200, maxHeight:'92vh', overflowY:'auto' },"
          if old_modal not in source:
              raise SystemExit('Expected modal style was not found; refusing a partial patch.')
          source = source.replace(old_modal, new_modal, 1)

          start_marker = "  // ── Leaderboard-specific: rank by valid_bet, not deposit"
          end_marker = "  const chaseList = campType==='leaderboard' ? lbRanked : [...players].sort((a,b)=>playerDeposit(b)-playerDeposit(a))"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Expected leaderboard derived-state block was not found; refusing a partial patch.')

          replacement = r'''  // ── Leaderboard-specific ranking/qualification ─────────────────────────────
  // Rank every enrolled player by the selected metric. Minimum thresholds are
  // qualification gates for rewards, not a reason to hide a player's position.
  const leaderboardMetric = ['turnover','deposit','turnover_deposit'].includes(selected?.leaderboard_metric)
    ? selected.leaderboard_metric
    : 'turnover'
  const leaderboardRankingValue = (p) => leaderboardMetric === 'deposit'
    ? playerDeposit(p)
    : (parseFloat(p.valid_bet) || 0)
  const leaderboardQualified = (p) => {
    const vb = parseFloat(p.valid_bet) || 0
    const dep = playerDeposit(p)
    if (leaderboardMetric === 'deposit') return dep >= minDepLb
    if (leaderboardMetric === 'turnover_deposit') return vb >= minBetTarget && dep >= minDepLb
    return vb >= minBetTarget
  }
  const lbRanked = campType === 'leaderboard'
    ? [...players].sort((a,b) => {
        const diff = leaderboardRankingValue(b) - leaderboardRankingValue(a)
        return diff || String(a.username || '').localeCompare(String(b.username || ''))
      }).map((p,i) => {
        const rankingValue = leaderboardRankingValue(p)
        const qualified = leaderboardQualified(p)
        const rank = i + 1
        const inTop = rank <= topN
        const reward = inTop && qualified ? (parseFloat(rankRewards[rank-1]?.amount)||0) : 0
        return { ...p, _vb:parseFloat(p.valid_bet)||0, _deposit:playerDeposit(p), _rankingValue:rankingValue, _posRank:rank, _rank:rank, _inTop:inTop && qualified, _reward:reward, _qualified:qualified }
      }) : []
  const cutoffValue = (campType==='leaderboard' && lbRanked[topN-1]) ? lbRanked[topN-1]._rankingValue : null

  const achieved = campType === 'leaderboard'
    ? lbRanked.filter(p=>p._qualified)
    : campType === 'dual_tier' && isDailyMode
    ? players.filter(p=>summaryData?.playerRows?.some(r=>r.username===p.username && (r.credit>0 || r.wcash>0)))
    : campType === 'dual_tier'
    ? players.filter(p=>calcDualTierReward(playerDeposit(p),p.valid_bet,rewardTiers).tierIndex>=0)
    : selected?.is_multi_level
    ? players.filter(p=>multiMetricsByPlayer[p.id]?.completedCount>0)
    : players.filter(p=>playerDeposit(p)>=depTarget)

  const dailyAchieved = isDailyMode ? players.filter(p=>dailyEntries[p.id]?.tier_achieved!==null && dailyEntries[p.id]?.tier_achieved!==undefined) : []

  const nearTarget = campType === 'leaderboard'
    ? lbRanked.filter(p=>{
        if (p._qualified) return false
        if (leaderboardMetric === 'turnover_deposit') {
          const betPct = minBetTarget ? p._vb/minBetTarget : 0
          const depPct = minDepLb ? p._deposit/minDepLb : 0
          return Math.min(betPct, depPct) >= 0.7
        }
        const target = leaderboardMetric === 'deposit' ? minDepLb : minBetTarget
        return target > 0 && p._rankingValue/target >= 0.7
      })
    : campType === 'dual_tier' ? []
    : selected?.is_multi_level
    ? players.filter(p=>{const m=multiMetricsByPlayer[p.id],n=m?.nextLevel,dep=playerDeposit(p);return n&&Number(n.deposit_threshold)>0&&dep/Number(n.deposit_threshold)>=0.7&&dep<Number(n.deposit_threshold)})
    : players.filter(p=>{const pct=depTarget?playerDeposit(p)/depTarget:0;return pct>=0.7&&pct<1})

  const inProgress = campType === 'leaderboard'
    ? lbRanked.filter(p=>!p._qualified && !nearTarget.includes(p))
    : campType === 'dual_tier'
    ? players.filter(p=>calcDualTierReward(playerDeposit(p),p.valid_bet,rewardTiers).tierIndex<0)
    : selected?.is_multi_level
    ? players.filter(p=>{const m=multiMetricsByPlayer[p.id];const n=m?.nextLevel;return !m?.allCompleted&&(!n||playerDeposit(p)<Number(n.deposit_threshold)*0.7)})
    : players.filter(p=>{const pct=depTarget?playerDeposit(p)/depTarget:0;return pct<0.7})

  const totalReward = campType === 'leaderboard'
    ? rankRewards.reduce((s,r)=>s+(parseFloat(r.amount)||0),0)
    : campType === 'dual_tier' && isDailyMode
    ? (summaryData ? summaryData.totalCredit + summaryData.totalWcash : 0)
    : campType === 'dual_tier'
    ? achieved.reduce((s,p)=>{const r=calcDualTierReward(playerDeposit(p),p.valid_bet,rewardTiers);return s+r.creditAmount+r.wcashAmount},0)
    : selected?.is_multi_level
    ? multiPayoutRows.reduce((s,r)=>s+r.rewardAmount,0)
    : achieved.reduce((s,p)=>s+calcReward(campType,playerDeposit(p),rewardPct,rewardFixed,goldVal,rewardCap,rewardTiers,campaignLevels,selected?.is_multi_level),0)

  const paidOut = campType === 'leaderboard'
    ? lbRanked.filter(p=>p._inTop&&p.payout_status==='paid').reduce((s,p)=>s+p._reward,0)
    : campType === 'dual_tier' && isDailyMode
    ? (summaryData ? summaryData.paidCredit + summaryData.paidWcash : 0)
    : campType === 'dual_tier'
    ? players.filter(p=>p.payout_status==='paid').reduce((s,p)=>{const r=calcDualTierReward(playerDeposit(p),p.valid_bet,rewardTiers);return s+r.creditAmount+r.wcashAmount},0)
    : selected?.is_multi_level
    ? multiPayoutRows.filter(r=>r.status==='paid').reduce((s,r)=>s+r.rewardAmount,0)
    : players.filter(p=>p.payout_status==='paid').reduce((s,p)=>s+calcReward(campType,playerDeposit(p),rewardPct,rewardFixed,goldVal,rewardCap,rewardTiers,campaignLevels,selected?.is_multi_level),0)
  const pendingPay = Math.max(0,totalReward-paidOut)
'''
          source = source[:start] + replacement + end_marker + source[end+len(end_marker):]

          msg_pattern = re.compile(r"\} else if \(campType === 'leaderboard'\) \{.*?\n    \} else \{", re.S)
          msg_match = msg_pattern.search(source)
          if not msg_match:
              raise SystemExit('Expected leaderboard WhatsApp branch was not found.')
          msg_branch = '''} else if (campType === 'leaderboard') {
      const rankingLabel = leaderboardMetric === 'deposit' ? 'deposit' : 'valid bet'
      const rankingValue = extra?.rankingValue ?? leaderboardRankingValue(p)
      const inTop = extra?.inTop
      const reward = extra?.reward || 0
      const gap = extra?.gap
      if (inTop) {
        body = `Hi ${p.username}, great news — you're currently in the Top ${topN} for ${campName}! If this holds, you'll receive RM${reward}. This is ${myName}.`
      } else if (gap != null) {
        body = `Hi ${p.username}, you're close in ${campName}! You need RM${Math.round(gap).toLocaleString()} more ${rankingLabel} to reach the Top ${topN}. This is ${myName}.`
      } else {
        body = `Hi ${p.username}, checking in on ${campName} — your current ${rankingLabel} is RM${Math.round(rankingValue).toLocaleString()}. This is ${myName}.`
      }
    } else {'''
          source = source[:msg_match.start()] + msg_branch + source[msg_match.end():]

          old_sort = "[...players].sort((a,b)=>(parseFloat(b.valid_bet)||0)-(parseFloat(a.valid_bet)||0))"
          if old_sort not in source:
              raise SystemExit('Expected leaderboard tab sort was not found.')
          source = source.replace(old_sort, "[...players].sort((a,b)=>leaderboardRankingValue(b)-leaderboardRankingValue(a) || String(a.username||'').localeCompare(String(b.username||'')))", 1)

          old_qualified = "const qualified=vb>=minBet||(minDep>0&&dep>=minDep)"
          if old_qualified not in source:
              raise SystemExit('Expected leaderboard tab qualification rule was not found.')
          source = source.replace(old_qualified, "const qualified=leaderboardQualified(p)", 1)
          source = source.replace("const rank=qualified?i+1:null", "const rank=i+1", 1)
          source = source.replace("const reward=inTop?(rankRwds[rank-1]?.amount||0):0", "const reward=inTop&&qualified?(rankRwds[rank-1]?.amount||0):0", 1)

          path.write_text(source)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Campaigns.jsx
          git add -u .github/workflows/leaderboard-patch.yml
          git commit -m "fix: align CRM leaderboard metric and widen campaign modal [leaderboard-patch-applied]"
          git push
