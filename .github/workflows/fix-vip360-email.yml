name: Fix VIP360 Email Field

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'fix: show VIP email in VIP360')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch VIP360
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/VIP360.jsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "setEditForm({ host_assigned: vipRes.data.host_assigned||'', tier: vipRes.data.tier||'', activity_status: vipRes.data.activity_status||'', phone: vipRes.data.phone||'', whatsapp: vipRes.data.whatsapp||'', churn_risk: vipRes.data.churn_risk||'', notes: vipRes.data.notes||'' })",
                  "setEditForm({ host_assigned: vipRes.data.host_assigned||'', tier: vipRes.data.tier||'', activity_status: vipRes.data.activity_status||'', phone: vipRes.data.phone||'', whatsapp: vipRes.data.whatsapp||'', email: vipRes.data.email||'', churn_risk: vipRes.data.churn_risk||'', notes: vipRes.data.notes||'' })",
              ),
              (
                  '                <Field label="WhatsApp">{vip.whatsapp}</Field>\n                <Field label="Birthday">{vip.birthday ? fmtDate(vip.birthday) : \'—\'}</Field>',
                  '                <Field label="WhatsApp">{vip.whatsapp}</Field>\n                <Field label="Email">{vip.email}</Field>\n                <Field label="Birthday">{vip.birthday ? fmtDate(vip.birthday) : \'—\'}</Field>',
              ),
              (
                  '                <Field label="Phone">{vip.phone || \'—\'}</Field>\n                <Field label="WhatsApp">{vip.whatsapp || \'—\'}</Field>',
                  '                <Field label="Phone">{vip.phone || \'—\'}</Field>\n                <Field label="WhatsApp">{vip.whatsapp || \'—\'}</Field>\n                <Field label="Email">{vip.email || \'—\'}</Field>',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source pattern not found: {old[:100]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Verify patch
        run: |
          grep -n 'Field label="Email"' src/pages/VIP360.jsx
          grep -n 'email: vipRes.data.email' src/pages/VIP360.jsx

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/VIP360.jsx .github/workflows/fix-vip360-email.yml
          git rm .github/workflows/fix-vip360-email.yml
          git commit -m "fix: show VIP email in VIP360"
          git push
