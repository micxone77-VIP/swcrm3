name: Leaderboard Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Leaderboard behavior regression
        run: node --test leaderboard-behavior-regression.test.mjs
      - name: Production build
        run: npm run build
