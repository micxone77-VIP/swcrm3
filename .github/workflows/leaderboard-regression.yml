name: Leaderboard Regression

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply leaderboard source migration
        run: python3 scripts/apply_leaderboard_patch.py
      - run: node --test leaderboard-behavior-regression.test.mjs
      - run: npm run build
      - name: Commit migration
        run: |
          if git diff --quiet -- src/pages/Campaigns.jsx; then
            echo "No source changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/pages/Campaigns.jsx
            git commit -m "fix: finalize leaderboard source migration [leaderboard-source-patched]"
            git push origin main
          fi
