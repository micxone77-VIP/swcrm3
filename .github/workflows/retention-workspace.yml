name: Retention Workspace CI

on:
  push:
    branches: [plan/retention-workspace]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Retention unit tests
        run: node --test retention-workspace.test.mjs
      - name: Production build
        run: npm run build
