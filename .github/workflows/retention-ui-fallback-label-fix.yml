name: Retention UI Fallback Label Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify regression test fails before fix
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/pages/RetentionWorkspace.jsx').read_text()
          for needle in ["{monthLabel(month)} retained", "No reactivation records for {monthLabel(month)}.", "retention-churn-${month}.csv", '<label>Selected month</label>']:
            if needle not in s: raise SystemExit('Expected old UI fragment missing: '+needle)
          if 'styles.fallbackBanner' in s: raise SystemExit('Fallback banner already exists')
          print('RED: old requested-month UI is confirmed')
          PY
      - name: Apply fallback UI label fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/RetentionWorkspace.jsx')
          s=p.read_text()
          replacements={
            "{monthLabel(previous)} {stats.previousActive.length.toLocaleString()} players → {monthLabel(month)} retained {stats.retained.length.toLocaleString()}, churned {stats.churned.length.toLocaleString()}": "{monthLabel(previous)} {stats.previousActive.length.toLocaleString()} players → {monthLabel(dataMonth)} retained {stats.retained.length.toLocaleString()}, churned {stats.churned.length.toLocaleString()}",
            '<label>Selected month</label>': '<label>Requested month</label>',
            "a.download=`retention-churn-${month}.csv`": "a.download=`retention-churn-${dataMonth}.csv`",
            "Saved ${stats.churned.length} players to the retention snapshot for ${monthLabel(month)}.": "Saved ${stats.churned.length} players to the retention snapshot for ${monthLabel(dataMonth)}.",
            'No reactivation records for {monthLabel(month)}.': 'No reactivation records for {monthLabel(dataMonth)}.',
            "<div style={styles.calendar}>📅</div></section>": "<div style={styles.calendar}>📅</div></section>",
            "dailyGrid:{display:'grid',": "fallbackBanner:{marginTop:12,padding:'11px 14px',border:'1px solid #d6a63a',borderRadius:10,background:'rgba(214,166,58,.12)',color:'var(--text)',fontSize:13},dailyGrid:{display:'grid',",
          }
          for old,new in replacements.items():
            if old not in s: raise SystemExit(f'Missing expected source fragment: {old[:100]}')
            s=s.replace(old,new,1)
          # Insert the banner immediately before the hero's calendar without changing JSX nesting.
          marker='<div style={styles.calendar}>📅</div></section>'
          banner="{window.usedFallback&&<div style={styles.fallbackBanner}>⚠️ Requested {monthLabel(month)}, but the latest available deposit snapshot is {monthLabel(dataMonth)}. This view is read-only until the requested month's snapshot is available.</div>}"+marker
          if marker not in s: raise SystemExit('Hero calendar marker missing')
          s=s.replace(marker,banner,1)
          p.write_text(s)
          PY
      - name: Verify regression test passes after fix
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/pages/RetentionWorkspace.jsx').read_text()
          for needle in ["{monthLabel(dataMonth)} retained", "No reactivation records for {monthLabel(dataMonth)}.", "retention-churn-${dataMonth}.csv", 'styles.fallbackBanner', '<label>Requested month</label>']:
            if needle not in s: raise SystemExit('GREEN failed: '+needle)
          print('GREEN: fallback UI labels and banner are present')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Restore generated dist
        run: git checkout -- dist 2>/dev/null || true
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/RetentionWorkspace.jsx
          git commit -m "fix: clarify retention fallback month in workspace" || exit 0
          git push origin main
