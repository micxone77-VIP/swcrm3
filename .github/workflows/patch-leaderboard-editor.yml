name: One-time Leaderboard Editor Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'feat: expose leaderboard metric in campaign editor'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch campaign editor
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/Campaigns.jsx')
          text = path.read_text(encoding='utf-8')
          marker = "{editCampForm.campaign_type==='leaderboard' && <div style={{ borderTop:'1px solid var(--border)', paddingTop:14, marginBottom:14 }}>"

          if 'Leaderboard Metric' in text:
              print('Leaderboard Metric already present; no patch needed.')
              raise SystemExit(0)

          insert = """<div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:10 }}>
            <div>
              <div style={s.flbl}>Leaderboard Metric</div>
              <select style={s.fsel} value={editCampForm.leaderboard_metric||'turnover'} onChange={e=>setEditCampForm(f=>({...f,leaderboard_metric:e.target.value}))}>
                <option value=\"turnover\">Turnover Race</option>
                <option value=\"deposit\">Deposit Race</option>
                <option value=\"turnover_deposit\">Turnover + Deposit Race</option>
              </select>
            </div>
          </div>
          """

          if marker not in text:
              raise SystemExit('Campaign leaderboard editor marker not found; aborting without changes.')

          path.write_text(text.replace(marker, marker + insert, 1), encoding='utf-8')
          print('Leaderboard Metric inserted into Campaigns.jsx')

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Campaigns.jsx
          git rm .github/workflows/patch-leaderboard-editor.yml
          git commit -m "feat: expose leaderboard metric in campaign editor"
          git push origin main
