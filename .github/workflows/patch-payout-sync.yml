name: One-time Payout Reward Sync Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch campaign payout synchronization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/pages/Campaigns.jsx')
          text = path.read_text(encoding='utf-8')

          marker = "    await loadPlayers(selected.id)\n  }\n\n  async function toggleCampaignReward"

          if 'updates.payout_status' in text and 'campaign_player_id: pid' in text:
              print('Payout reward synchronization already present; no patch needed.')
          else:
              if marker not in text:
                  raise SystemExit('Campaign updatePlayer insertion marker not found; aborting without changes.')

              insert = """    // Keep the Player Portal reward row synchronized with the CRM payout status.\n    // The CRM leaderboard table updates campaign_players.payout_status, while\n    // the Player Portal reads campaign_rewards.status. Both must represent the\n    // same payout state or the two screens can disagree.\n    if (Object.prototype.hasOwnProperty.call(updates, 'payout_status') && ['paid','pending'].includes(updates.payout_status)) {\n      const rewardPatch = updates.payout_status === 'paid'\n        ? { status:'paid', paid_at: updates.payout_date || new Date().toISOString() }\n        : { status:'pending', paid_at:null }\n      const { error: rewardSyncError } = await supabase\n        .from('campaign_rewards')\n        .update(rewardPatch)\n        .eq('campaign_player_id', pid)\n      if (rewardSyncError) {\n        alert('CRM payout saved, but Player Portal reward sync failed: ' + rewardSyncError.message)\n        console.error('campaign_rewards payout sync failed:', rewardSyncError)\n      }\n    }\n\n"""
              path.write_text(text.replace(marker, insert + marker, 1), encoding='utf-8')
              print('Payout reward synchronization inserted into Campaigns.jsx')
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Campaigns.jsx
          git rm .github/workflows/patch-payout-sync.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: synchronize CRM payout status to portal rewards"
          git push origin main
