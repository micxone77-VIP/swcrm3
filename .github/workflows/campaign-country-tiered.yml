name: Campaign Country Tiered Verification
on:
  push:
    branches: [feat/campaign-country-tiered-v2]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test tests/campaign-audience-country.test.mjs tests/campaign-enrollment.test.mjs
      - run: npm run build
