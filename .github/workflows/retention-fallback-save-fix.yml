name: Retention Fallback Save Fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/retention-fallback-save-regression.mjs'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify regression test fails before fix
        run: |
          if node scripts/retention-fallback-save-regression.mjs; then
            echo 'Regression guard unexpectedly passed before fallback save fix.'
            exit 1
          fi
      - name: Apply fallback save UX fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/RetentionWorkspace.jsx')
          s = p.read_text()
          old_guard = "if(window.usedFallback){setError(`Cannot save a snapshot for ${monthLabel(month)} because the latest available deposit snapshot is ${monthLabel(dataMonth)}. Complete the current-month snapshot first.`);return}"
          new_guard = "if(window.usedFallback){setNotice(`Cannot save a snapshot for ${monthLabel(month)} because the latest available deposit snapshot is ${monthLabel(dataMonth)}. Complete the current-month snapshot first.`);return}"
          if old_guard not in s:
              raise SystemExit('fallback save guard not found')
          s = s.replace(old_guard, new_guard, 1)
          old_button = "onClick={saveSnapshot} disabled={saving}>{saving?'Saving…':'💾 Save to DB'}"
          new_button = "onClick={saveSnapshot} disabled={saving||window.usedFallback}>{saving?'Saving…':'💾 Save to DB'}"
          if old_button not in s:
              raise SystemExit('save button not found')
          s = s.replace(old_button, new_button, 1)
          p.write_text(s)
          PY
      - name: Verify regression test passes after fix
        run: node scripts/retention-fallback-save-regression.mjs
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Restore generated dist before commit
        run: git restore dist || true
      - name: Commit fix and remove temporary regression files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm scripts/retention-fallback-save-regression.mjs .github/workflows/retention-fallback-save-fix.yml
          git add src/pages/RetentionWorkspace.jsx
          git add -u scripts/retention-fallback-save-regression.mjs .github/workflows/retention-fallback-save-fix.yml
          git commit -m 'fix: disable retention save during snapshot fallback'
          git push
