name: Campaign Enrollment Tests

on:
  push:
    branches: [feat/campaign-mixed-enrollment]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: node --test tests/campaign-enrollment.test.mjs
      - name: Build
        run: |
          npm ci
          npm run build
