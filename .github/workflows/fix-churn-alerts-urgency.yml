name: Fix Churn Alerts Urgency

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair urgency score declaration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/ChurnAlerts.jsx')
          text = p.read_text()
          old = 'reasons=[],urgencyScore=0;if('
          new = 'reasons=[];let urgencyScore=0;if('
          if old not in text:
              raise SystemExit('Expected urgency score declaration was not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ChurnAlerts.jsx
          git commit -m 'fix: allow churn alert urgency score updates'
          git push
