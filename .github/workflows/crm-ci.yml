name: CRM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Leaderboard metric regression
        run: node --test leaderboard-metric-regression.test.mjs
      - name: Leaderboard behavior regression
        run: node --test leaderboard-behavior-regression.test.mjs
      - name: Retention tier priority regression
        run: node --test retention-tier-priority.test.mjs
      - name: Retention host tier recovery regression
        run: node --test retention-host-tier.test.mjs
      - name: Retention churn urgency regression
        run: node --test retention-churn-urgency.test.mjs
      - name: Retention queue closure regression
        run: node --test retention-queue-closure.test.mjs
      - name: Production build
        run: npm run build
