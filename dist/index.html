<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SureWin VIP CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        /* ── V2 Design Tokens ── */
        /* Backgrounds */
        --bg:        #07111F;
        --surface:   #0D1827;
        --surface2:  #111F30;
        --border:    #223247;

        /* Text */
        --text:      #F5F7FA;
        --text-2:    #C4CFDB;
        --muted:     #91A0B2;
        --disabled:  #617083;

        /* Brand */
        --brand:     #FF6A00;
        --brand-dim: rgba(255,106,0,.15);

        /* Semantic */
        --success:   #22C55E;
        --warning:   #F59E0B;
        --danger:    #EF4444;
        --info:      #3B82F6;

        /* VIP Tiers */
        --tier-diamond:  #8B5CF6;
        --tier-platinum: #3B82F6;
        --tier-gold:     #EAB308;
        --tier-silver:   #94A3B8;
        --tier-bronze:   #CD7F32;
        --tier-black:    #E5E7EB;

        /* Spacing scale */
        --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
        --s5: 20px; --s6: 24px; --s8: 32px;

        /* Radius */
        --r-sm: 6px;
        --r-md: 10px;
        --r-lg: 14px;

        /* Shadows */
        --shadow-sm: 0 1px 3px rgba(0,0,0,.4);
        --shadow-md: 0 4px 12px rgba(0,0,0,.5);

        /* Legacy compat */
        --accent:  #FF6A00;
        --green:   #22C55E;
        --red:     #EF4444;
        --amber:   #F59E0B;
        --gold:    #EAB308;
        --diamond: #8B5CF6;
      }

      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      a { color: var(--info); text-decoration: none; }
      button { cursor: pointer; font-family: inherit; font-size: 14px; }
      input, select, textarea { font-family: inherit; font-size: 14px; }

      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--disabled); }

      /* Utility classes */
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    </style>
    <script type="module" crossorigin src="/assets/index-Dgl6Q7Ct.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
